[project]
name = "amlab"
version = "0.1.0"
description = "Analysis environment and labtools for the AMLab measurement-science experiments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Paolo Bosetti", email = "paolo.bosetti@unitn.it" }]

dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "jupyter>=1.0",
  "ipykernel>=6.29",
  "nbclient>=0.9",
  "nbformat>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# The Python binding to the board (`arduino_driver`) is deliberately NOT a
# dependency here. It is not on PyPI -- it installs from the ArduinoDriver
# repository, and its wheel is built with CMake -- and nothing on this site
# needs it: every analysis template runs against recorded or generated data.
# Install it on a bench machine with the command in setup/python.qmd.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# labtools lives under shared/python so that the R implementation can sit
# beside it in shared/R; the package itself is plain and importable.
package-dir = { "" = "shared/python" }

[tool.setuptools.packages.find]
where = ["shared/python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
